{% extends "layout.html" %}

{% block title %}Contact Us - Grant Roadmap{% endblock %}

{% block content %}
<div class="contact-page">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 contact-card">
                    <div class="card-body p-5">
                        <h2 class="mb-1 fw-bold contact-card-title">{{ page_title }}</h2>
                        <p class="text-muted mb-4">{{ page_subtitle }}</p>

                        <form method="POST" action="{{ url_for('submit_contact') }}">
                            <input type="hidden" name="contact_type" value="{{ contact_type }}">

                            <div class="mb-4">
                                <label for="name" class="form-label fw-bold">Name <span class="contact-required">*</span></label>
                                <input type="text" class="form-control contact-form-input" id="name" name="name" placeholder="Your name" required>
                            </div>

                            <div class="mb-4">
                                <label for="email" class="form-label fw-bold">Email Address <span class="contact-required">*</span></label>
                                <input type="email" class="form-control contact-form-input" id="email" name="email" placeholder="your.email@example.com" required>
                                <small class="text-muted">We'll use this email to get back to you</small>
                            </div>

                            <div class="mb-4">
                                <label for="message" class="form-label fw-bold">Request / Message <span class="contact-required">*</span></label>
                                <textarea class="form-control contact-form-input" id="message" name="message" rows="6" placeholder="Please tell us how we can help you..." required></textarea>
                                <small class="text-muted">Maximum 1000 characters</small>
                            </div>

                            <div class="d-grid gap-2 mb-3">
                                <button type="submit" class="btn btn-lg contact-btn-primary">Send Message</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
