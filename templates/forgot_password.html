{% extends "layout.html" %}

{% block title %}Forgot Password - Grant Roadmap{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="container">
        <div class="row justify-content-center align-items-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Forgot Password</h2>
                        <p class="text-muted">Enter your registered email and we’ll send you a link to reset your password.</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                        <div class="mb-3">
                            <label class="form-label" for="email">Email Address</label>
                            <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="your@email.com" value="{{ email or '' }}" required>
                        </div>
                        <div class="d-grid gap-2 mb-2">
                            <button type="submit" class="btn btn-gradient-yellow btn-lg w-100">Send reset link</button>
                        </div>
                        {% if error %}
                        <p class="text-danger small mb-0 text-center" id="forgot-error">{{ error }}</p>
                        {% endif %}
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <a href="{{ url_for('auth.signin') }}" class="text-decoration-none fw-bold">Back to Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
