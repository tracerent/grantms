{% extends "layout.html" %}

{% block title %}FAQs - Grant Roadmap{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="{{ url_for('main.home') }}" class="btn btn-gradient-yellow btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Back to Home
        </a>
    </div>
    <h1 class="fw-bold mb-4">Frequently Asked Questions</h1>

    <div class="accordion faq-accordion" id="faqAccordion">
        {% for item in faq_items %}
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button {% if not loop.first %}collapsed{% endif %}" type="button" data-bs-toggle="collapse" data-bs-target="#faq-{{ loop.index }}" aria-expanded="{% if loop.first %}true{% else %}false{% endif %}" aria-controls="faq-{{ loop.index }}" id="faq-heading-{{ loop.index }}">
                    {{ item.question }}
                </button>
            </h2>
            <div id="faq-{{ loop.index }}" class="accordion-collapse collapse {% if loop.first %}show{% endif %}" aria-labelledby="faq-heading-{{ loop.index }}" data-bs-parent="#faqAccordion">
                <div class="accordion-body faq-content">
                    {% if item.answer %}
                    {{ item.answer | safe }}
                    {% else %}
                    <span class="text-muted">No answer provided.</span>
                    {% endif %}
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
