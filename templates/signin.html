{% extends "layout.html" %}

{% block title %}Sign In - Grant Roadmap{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="container">
        <div class="row justify-content-center align-items-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Welcome Back</h2>
                        <p class="text-muted">Sign in to access your grants</p>
                    </div>

                    <form method="POST" action="{{ url_for('signin') }}">
                        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
                        <div class="mb-3">
                            <label class="form-label" for="email">Email Address</label>
                            <input 
                                type="email" 
                                class="form-control form-control-lg" 
                                id="email" 
                                name="email" 
                                placeholder="your@email.com"
                                required
                            />
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <input 
                                type="password" 
                                class="form-control form-control-lg" 
                                id="password" 
                                name="password" 
                                placeholder="••••••••"
                                required
                            />
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                            Sign In with Email
                        </button>
                    </form>
                    <br>
                    <div class="text-center">
                        <p class="text-muted">
                            <a href="{{ url_for('forgot_password') }}" class="text-decoration-none">Forgot your password?</a>
                        </p>
                    </div>

                    <div class="text-center my-3">
                        <span class="text-muted small">— Or sign in with —</span>
                    </div>

                    <form method="GET" id="oauth-form" action="" data-auth-base="{{ request.url_root }}auth/">
                        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
                        <div class="oauth-buttons-row">
                            <button type="button" class="btn btn-oauth btn-oauth-google oauth-btn" data-provider="google" title="Sign in with Google" aria-label="Sign in with Google">
                                <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                            </button>
                            <button type="button" class="btn btn-oauth btn-oauth-microsoft oauth-btn" data-provider="microsoft" title="Sign in with Microsoft" aria-label="Sign in with Microsoft">
                                <svg width="24" height="24" viewBox="0 0 23 23"><path fill="#F25022" d="M1 1h10v10H1z"/><path fill="#7FBA00" d="M12 1h10v10H12z"/><path fill="#00A4EF" d="M1 12h10v10H1z"/><path fill="#FFB900" d="M12 12h10v10H12z"/></svg>
                            </button>
                            <button type="button" class="btn btn-oauth btn-oauth-apple oauth-btn" data-provider="apple" title="Sign in with Apple" aria-label="Sign in with Apple">
                                <i class="bi bi-apple oauth-icon-apple" style="font-size: 1.5rem;"></i>
                            </button>
                        </div>
                    </form>
                    <script src="{{ url_for('static', filename='js/signin.js') }}"></script>

                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="text-muted">Don't have an account? 
                            <a href="{{ url_for('signup') }}" class="text-decoration-none fw-bold">Sign Up</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
