{% extends "layout.html" %}

{% block title %}Reset Password - Grant Roadmap{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="container">
        <div class="row justify-content-center align-items-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Set new password</h2>
                        <p class="text-muted">Enter your new password below.</p>
                    </div>

                    <form method="POST" action="{{ url_for('reset_password') }}">
                        <input type="hidden" name="token" value="{{ token }}">
                        <div class="mb-3">
                            <label class="form-label" for="password">New Password</label>
                            <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="••••••••" required minlength="6">
                            <small class="text-muted">At least 6 characters</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="confirm_password">Confirm Password</label>
                            <input type="password" class="form-control form-control-lg" id="confirm_password" name="confirm_password" placeholder="••••••••" required minlength="6">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-gradient-yellow btn-lg w-100">Reset password</button>
                        </div>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <a href="{{ url_for('signin') }}" class="text-decoration-none">Back to Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
